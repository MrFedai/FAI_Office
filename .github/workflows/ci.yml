# Same steps as a local run: everything lives in ci/*.sh, this file only provides the machine.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: ci/all.sh
        run: ci/all.sh
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: build/ci/
