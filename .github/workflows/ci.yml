# Same steps as a local run: everything lives in ci/*.sh, this file only provides the machine.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: ci/all.sh
        run: ci/all.sh
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: build/ci/

  # Windows x64 desktop: app image + MSI, desktop tests with screenshots, size gate (ci/windows.sh, Git Bash).
  # ci/windows-run.sh downloads fai-office-windows onto the owner's PC (from WSL).
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (the ci/*.sh scripts run in Git Bash)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: ci/windows.sh
        run: bash ci/windows.sh
      - name: App image
        uses: actions/upload-artifact@v4
        with:
          name: fai-office-windows
          path: app/build/compose/binaries/main/app/
          if-no-files-found: error
          retention-days: 30
      - name: MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: fai-office-windows-msi
          path: app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 30
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-shots
          path: app/build/bakis/
          if-no-files-found: ignore
          retention-days: 30
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-windows
          path: build/ci/
